[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hayate-runtime"
version = "0.1.0"
description = "Consumer GPU runtime extensions for the MiniMax-H3 engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "HAYATE contributors" }]
dependencies = [
  "psutil>=5.9",
  "PyYAML>=6.0",
  "rich>=13.7",
  "safetensors>=0.4",
]

[project.optional-dependencies]
cuda = [
  "comfy-kitchen==0.2.31",
  "numpy>=2.0",
  "torch>=2.7.1",
]
generation = [
  "accelerate>=1.0",
  "av>=13.0",
  "comfy-kitchen==0.2.31",
  "diffusers>=0.35",
  "easydict>=1.13",
  "einops>=0.8",
  "huggingface-hub>=0.30",
  "imageio-ffmpeg>=0.6",
  "numpy>=2.0",
  "omegaconf>=2.3",
  "opencv-python>=4.10",
  "pillow>=11.0",
  "pydantic>=2.10",
  "tiktoken>=0.9",
  "torch>=2.7.1",
  "torchaudio>=2.7.1",
  "torchvision>=0.22",
  "tqdm>=4.67",
  "transformers>=4.51",
]

[project.scripts]
hayate = "hayate.cli.main:entrypoint"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["hayate"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
